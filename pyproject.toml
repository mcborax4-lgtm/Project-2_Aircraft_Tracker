[tool.poetry]
name = "coursework"
version = "0.1.0"
description = "Курсовая работа по анализу банковских транзакций"
authors = ["Maxim <mcborax4@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
yfinance = "^0.2.40"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
black = "^24.10.0"
isort = "^5.13.2"
flake8 = "^7.1.1"
mypy = "^1.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
exclude = ['venv/', '.venv/']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --cov=src"
testpaths = ["tests"]